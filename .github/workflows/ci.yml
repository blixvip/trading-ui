name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build library
        run: npm run build:lib

      - name: Build site
        run: npm run build:site

      # The registry is committed, so a stale r/*.json would hand users an
      # install command that does not match the source in the repo.
      - name: Registry is in sync with source
        run: |
          npm run registry
          git diff --exit-code -- registry.json r/ \
            || (echo "::error::registry.json / r/ are stale - run 'npm run registry' and commit"; exit 1)

      - name: Package contents
        run: npm pack --dry-run
